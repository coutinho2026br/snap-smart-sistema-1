<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snap Smart – Sistema de gestão</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090b12;--pn:#121624;--ln:#232a3f;--tx:#eef1f9;--mu:#8e98b3;--az:#2f6bff;--ok:#2fd08a;--rd:#ff6b78;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f1f4fb;--pn:#fff;--ln:#dbe1ef;--tx:#0e1220;--mu:#5a6482;--ok:#0f9d63;--rd:#d63a4a;color-scheme:light}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 Sora,system-ui,sans-serif;min-height:100vh}
.w{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
header img{height:52px;width:auto;background:#000;padding:8px 14px;border-radius:12px;flex:none}
h1{font-size:24px;font-weight:800;margin:0;letter-spacing:-.5px}
header small{color:var(--mu)}
.dm{margin-left:auto;background:var(--az);color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px}
nav{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
nav button{flex:none;background:var(--pn);color:var(--mu);border:1px solid var(--ln);border-radius:10px;padding:10px 16px;font:600 14px Sora,system-ui,sans-serif;cursor:pointer}
nav button.on{background:var(--az);border-color:var(--az);color:#fff}
.c{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
.c h2{font-size:16px;margin:0 0 12px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.st div{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:12px 14px}
.st b{display:block;font-size:22px;font-weight:800}.st span{color:var(--mu);font-size:13px}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
input,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px;font:400 15px Sora,system-ui,sans-serif}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--az);outline-offset:2px}
.b{background:var(--az);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:600 15px Sora,system-ui,sans-serif;cursor:pointer}
.b:disabled{opacity:.4;cursor:not-allowed}
.tb{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:13px}
.t{color:var(--mu);font-size:13px}
.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.er{background:color-mix(in srgb,var(--rd) 15%,transparent);color:var(--rd);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.nt{border-left:3px solid var(--az);padding:8px 12px;color:var(--mu);margin-bottom:14px;font-size:14px}
.tot{font-size:26px;font-weight:800;margin:12px 0}
.tg{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--az) 22%,transparent);color:var(--az)}
.in{color:var(--ok)}.out{color:var(--rd)}
#ch{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 0}
.m{max-width:82%;padding:9px 13px;border-radius:14px;font-size:14px}
.m.u{align-self:flex-end;background:var(--az);color:#fff;border-bottom-right-radius:4px}
.m.b{align-self:flex-start;background:var(--bg);border:1px solid var(--ln);border-bottom-left-radius:4px}
.ch{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.ch button{background:transparent;color:var(--tx);border:1px solid var(--ln);border-radius:99px;padding:6px 12px;font:400 13px Sora,system-ui,sans-serif;cursor:pointer}
.sd{display:flex;gap:8px}
@media(prefers-reduced-motion:no-preference){.ok{animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(-4px)}}}
@media print{body *{visibility:hidden}#pr,#pr *{visibility:visible;color:#000!important}#pr{position:absolute;left:0;top:0;width:100%;background:#fff;border:0}.bt0{display:none!important}}
